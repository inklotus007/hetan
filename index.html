<!DOCTYPE html>

<head>

<title>河滩 · 一九九五年四月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#9fc5e0;font-family:Georgia,'Songti SC',serif;touch-action:none}
#c{display:block;width:100%;height:100%}
/* 准星 */
#xhair{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
#xhair:before,#xhair:after{content:'';position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px rgba(0,0,0,.5)}
#xhair:before{left:8px;top:0;width:2px;height:18px}
#xhair:after{left:0;top:8px;width:18px;height:2px}
/* 顶栏 */
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#f4efe2;font-size:13px;letter-spacing:4px;text-shadow:0 1px 3px rgba(40,50,60,.5);pointer-events:none;z-index:4}
#menuBtn{pointer-events:auto}   /* 顶栏穿透但菜单要点得动（v28.3：mute/tokBtn删了，☰顶上——删UI要连豁免清单一起改） */
#top small{display:block;font-size:11px;letter-spacing:2px;opacity:.85;margin-top:2px}
/* 热栏 */
#hot{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;z-index:6;overflow-x:auto;max-width:94vw;padding:4px 6px;background:rgba(30,40,50,.25);border-radius:8px;scrollbar-width:none}#hot::-webkit-scrollbar{display:none}
.slot{width:40px;height:40px;border:2px solid rgba(255,255,255,.5);border-radius:5px;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(30,40,50,.35)}
.slot.on{border-color:#ffe9a8;box-shadow:0 0 0 2px rgba(255,233,168,.55),0 2px 6px rgba(30,40,50,.35)}
.slot span{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:#f4efe2;text-shadow:0 1px 2px rgba(40,50,60,.6);white-space:nowrap}
/* 移动端按钮 */
.mbtn{position:fixed;z-index:7;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(50,60,70,.38);color:#f4efe2;font-size:16px;letter-spacing:2px;display:none;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;font-family:inherit;transition:transform .06s,background .06s}
.mbtn:active{background:rgba(240,230,200,.5);transform:scale(0.9);border-color:#f0e6c8}
#btnDig{right:calc(18px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
#btnPut{right:calc(88px + env(safe-area-inset-right));bottom:calc(160px + env(safe-area-inset-bottom))}
#btnJmp{right:calc(18px + env(safe-area-inset-right));bottom:calc(180px + env(safe-area-inset-bottom))}
/* 摇杆 */
#stickBase{position:fixed;z-index:7;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(50,60,70,.25);display:none;pointer-events:none}
#stickKnob{position:fixed;z-index:8;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5);display:none;pointer-events:none}
/* 抽屉：顶栏信息收纳（v28）——版本/世界/档/连接/声音/导出，点☰展开收起 */
#menuBtn{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;cursor:pointer;font-size:16px;opacity:.85;z-index:25;padding:2px 8px;color:#fff;text-shadow:0 1px 3px rgba(40,50,60,.5)}
#menuPanel{position:fixed;top:calc(36px + env(safe-area-inset-top));right:8px;width:min(252px,64vw);background:#f3ecd8;border:1px solid #d0c29c;border-radius:10px;padding:10px 12px;z-index:26;display:none;box-shadow:0 8px 30px rgba(40,30,10,.28);font-size:12px;color:#3a2f1e;letter-spacing:1px}
#menuPanel.on{display:block}
.mHead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:4px;padding-bottom:6px;border-bottom:1px solid #d0c29c}
.mHead b{color:#96532a}
.mRow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e2d6b4;gap:8px}
.mRow:last-child{border-bottom:0}
.mRow b{font-weight:normal;text-align:right;max-width:62%}
.mBtn{cursor:pointer;text-decoration:underline;color:#8a7448}
#menuClose{cursor:pointer;color:#a09478;padding:0 4px;font-size:14px}
/* 碑文 */
#stele{position:fixed;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:min(300px,52vw);padding:8px 12px;background:rgba(24,28,32,.66);color:#efe8d8;font-size:12px;line-height:1.7;letter-spacing:1px;border-radius:6px;border:1px solid rgba(255,240,200,.22);opacity:0;transition:opacity .8s;pointer-events:none;z-index:9;text-align:left;max-height:38vh;overflow:hidden}
/* 载入 */
#boot{position:fixed;inset:0;background:#9fc5e0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity .6s}
#boot h1{color:#f4efe2;font-size:26px;letter-spacing:8px;font-weight:normal;text-shadow:0 2px 6px rgba(40,50,60,.4)}
#boot p{color:#eef4f8;font-size:12px;letter-spacing:2px;margin-top:12px}
#help{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;color:rgba(244,239,226,.9);text-shadow:0 1px 2px rgba(40,50,60,.5);z-index:4;pointer-events:none;letter-spacing:1px}
/* 留言板UI（纸质） */
#boardUI{position:fixed;inset:0;background:rgba(20,16,8,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#boardUI.on{display:flex}
#boardCard{background:#f3ecd8;color:#3a2f1e;max-width:400px;width:100%;max-height:80vh;display:flex;flex-direction:column;border:1px solid #d8caa4;box-shadow:0 8px 40px rgba(0,0,0,.4)}
#boardHead{padding:10px 14px;border-bottom:1px solid #d8caa4;letter-spacing:3px;font-size:13px;color:#8a7448;display:flex;justify-content:space-between;align-items:center}
#boardHead b{cursor:pointer;font-weight:normal}
#boardList{overflow-y:auto;padding:8px 14px;flex:1;min-height:120px}
.bMsg{padding:7px 2px;border-bottom:1px dashed #ddd0ac;font-size:13px;line-height:1.55}
.bMsg .bn{color:#8a7448;font-size:12px;margin-right:6px}
.bMsg .bt{color:#a09478;font-size:11px;margin-left:6px}
#boardFoot{padding:10px 14px;border-top:1px solid #d8caa4}
#boardIn{width:100%;height:52px;background:#faf6ea;border:1px solid #d0c29c;color:#3a2f1e;font-family:inherit;font-size:13px;padding:6px 8px;resize:none}
#boardGo{margin-top:6px;width:100%;padding:7px;background:#8a7448;color:#f3ecd8;border:0;letter-spacing:6px;font-size:13px;font-family:inherit;cursor:pointer}
#boardTip{margin-top:5px;font-size:11px;color:#a09478;line-height:1.5}
#btnBoard{position:fixed;left:50%;bottom:26vh;transform:translateX(-50%);display:none;padding:9px 22px;background:rgba(58,47,30,.82);color:#f3ecd8;border:1px solid #d8caa4;border-radius:3px;letter-spacing:4px;font-size:13px;font-family:inherit;z-index:8;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><h1>河 滩</h1><p>一九九五年四月 · 县城外</p><p id="bootTip">正在铺开河滩……</p><p id="bootVer" style="font-size:10px;opacity:.75;margin-top:6px"></p></div>
<canvas id="c"></canvas>
<div id="xhair"></div>
<div id="top">河 滩<small>杨棉起来了 · 想搭什么搭什么</small><span id="menuBtn">☰</span></div>
<div id="menuPanel">
  <div class="mHead">河滩 <b id="menuVer"></b><span id="menuClose">×</span></div>
  <div class="mRow"><span>世界</span><b id="mWorld">—</b></div>
  <div class="mRow"><span>我的档</span><b class="mBtn" id="mName" title="点这个改名字">—</b></div>
  <div class="mRow"><span>同步</span><b id="mSync">—</b></div>
  <div class="mRow"><span>牌子</span><b class="mBtn" id="mMove" style="cursor:pointer">搬 · 点了跟着你</b></div>
  <div class="mRow"><span>留言板</span><b id="mBoard">—</b></div>
  <div class="mRow"><span>令牌</span><b class="mBtn" id="mTok">—</b></div>

</div>

<div id="help"></div>
<div id="btnBoard">留言板</div>
<div id="boardUI">
  <div id="boardCard">
    <div id="boardHead">河滩留言板 <span id="nameBtn" style="cursor:pointer;font-size:12px;letter-spacing:1px;text-decoration:underline">改名</span> · <span id="tokBtn2" style="cursor:pointer;font-size:12px;letter-spacing:1px;text-decoration:underline">令牌</span> · <span id="expBtn" style="cursor:pointer;font-size:12px;letter-spacing:1px;text-decoration:underline">导出搭建</span> · <b id="boardClose">合上</b></div>
    <div id="boardList"></div>
    <div id="boardFoot">
      <textarea id="boardIn" maxlength="40" placeholder="写点什么。四十个字以内。"></textarea>
      <button id="boardGo">写上</button>
      <div id="boardTip"></div>
    </div>
  </div>
</div>

<div class="mbtn" id="btnDig">挖</div>

<div class="mbtn" id="btnJmp">跳</div>
<div id="stickBase"></div><div id="stickKnob"></div>
<script src="three.min.js"></script>
<script>
/* ================= 基础 ================= */
const W=160, D=130, H=40;             // 世界尺寸（v39：90×90→160×130——广场后面要盖；地形函数参数化，新区自动生成同类滩岸；坐标系不动，已有搭建原地不变）
const AIR=0;
// 方块类型: 1草 2土 3石 4沙 5木 6叶 7砖 8水 9玻璃 10木板 11石砖 12瓦
const TYPES={
  1:{n:'草', c:0x7aa25c, mats:['grass_side','grass_side','grass_top','dirt','grass_side','grass_side']},
  2:{n:'土', tex:'dirt'},
  3:{n:'石', tex:'stone'},
  4:{n:'沙', tex:'sand'},
  5:{n:'木', c:0x7a5b3a, mats:['wood_side','wood_side','wood_top','wood_top','wood_side','wood_side']},
  6:{n:'叶', tex:'leaves'},
  7:{n:'砖', tex:'brick'},
  8:{n:'水', c:0x4d8fae, water:true},
  9:{n:'玻', c:0xcfe0e6, tex:'glass', glass:true},
  10:{n:'板', c:0xb08a54, tex:'plank'},
  11:{n:'石砖', c:0x9a9a96, tex:'stonebrick'},
  12:{n:'瓦', c:0x7a4a42, tex:'roof'},
  13:{n:'阶', c:0x9a9a96, tex:'stonebrick', stair:true},
  14:{n:'炬', c:0xffb040, torch:true},
  15:{n:'红花', plant:'flower_red'},
  16:{n:'黄花', plant:'flower_yellow'},
  17:{n:'草', plant:'grass'},
  18:{n:'凳', c:0x8a6a48, tex:'plank', bench:true},
  19:{n:'篱', c:0x7a5b3a, tex:'wood_side', fence:true},
  20:{n:'路', c:0x9a9a96, tex:'stonebrick', path:true},
  21:{n:'桌', c:0x8a6a48, tex:'plank', table:true},
  22:{n:'灯', c:0xffe0a0, lantern:true}
};
const world=new Uint8Array(W*H*D);
const idx=(x,y,z)=>(x*D+z)*H+y;
const inW=(x,y,z)=>x>=0&&x<W&&y>=0&&y<H&&z>=0&&z<D;
const get=(x,y,z)=>inW(x,y,z)?world[idx(x,y,z)]:AIR;

/* ---- 地形：河滩 + 老柳树 ---- */
function hash(x,z){let h=Math.sin(x*127.1+z*311.7)*43758.5453;return h-Math.floor(h);}
function height(x,z){
  // 河从东北向西南弯过去，滩地沿河
  const river=Math.sin(x*0.09)*6+Math.cos(z*0.07)*4; // 河道中心线的z偏移
  const dz=Math.abs(z-(34+river));                    // 距河中心
  let h;
  if(dz<5)      h=2+Math.round(dz*0.3);               // 河床
  else if(dz<11) h=4+Math.round((dz-5)*0.5);          // 滩
  else          h=6+Math.round((dz-11)*0.35+hash(x,z)*1.6); // 岸上缓坡
  return Math.max(1,Math.min(H-3,h));
}
for(let x=0;x<W;x++)for(let z=0;z<D;z++){
  const h=height(x,z), river=Math.sin(x*0.09)*6+Math.cos(z*0.07)*4, dz=Math.abs(z-(34+river));
  for(let y=0;y<=h;y++){
    let t;
    if(dz<5)       t=(y===h)?4:3;                       // 河底：沙面石身
    else if(dz<9)  t=(y===h)?4:2;                       // 滩：沙面土身
    else           t=(y===h)?1:(y>h-3?2:3);             // 岸：草面土石
    if(dz<7&&y===h) t=4;                                // 水边全沙
    world[idx(x,y,z)]=t;
  }
  if(h<5)for(let y=h+1;y<=5;y++)world[idx(x,y,z)]=8;    // 水位线5：低于水位的全部灌满——河心不再露底（v25修「水没填满」）
}
// 老柳树：岸上几棵
const trees=[[12,12],[20,50],[44,10],[50,44],[30,58],[8,40],[52,26],[68,38],[96,56]];   // v39：新区东西滩各添一棵
trees.forEach(([tx,tz])=>{
  const h=height(tx,tz); if(h<5)return;
  const th=3+Math.floor(hash(tx,tz)*2);
  for(let y=h+1;y<=h+th;y++)world[idx(tx,y,tz)]=5;      // 干
  for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=0;dy<=2;dy++){
    const r=Math.abs(dx)+Math.abs(dz)+dy*1.4;
    if(r<=3.4&&!(dx===0&&dz===0&&dy<1)){const X=tx+dx,Z=tz+dz,Y=h+th+dy-1;if(inW(X,Y,Z)&&!world[idx(X,Y,Z)])world[idx(X,Y,Z)]=6;}
  }
});
// 碑：出生点旁
const STX=38,STZ=22;   // v29：碑和出生点移到同志的广场上（TA亲手削山铺砖那块）——牌子立在广场中央
{const h=height(STX,STZ);
 world[idx(STX,h+1,STZ)]=3;world[idx(STX,h+2,STZ)]=3;world[idx(STX-1,h+1,STZ)]=3;world[idx(STX+1,h+1,STZ)]=3;}

/* ---- 存档（diff） ---- */
const SKEY='hetan_save_v1';
let diffs={r:[],a:{}};
try{const s=localStorage.getItem(SKEY);if(s)diffs=JSON.parse(s);}catch(e){}
let worldDirty=false;   // 存量的搭也上云（声明必须在最前——v14的TDZ死法）
if(diffs.r.length||Object.keys(diffs.a).length)worldDirty=true;
diffs.r.forEach(([x,y,z])=>{if(inW(x,y,z))world[idx(x,y,z)]=AIR;});
for(const k in diffs.a){const[x,y,z]=k.split(',').map(Number);if(inW(x,y,z))world[idx(x,y,z)]=diffs.a[k];}
function saveDiff(x,y,z,t){
  const key=x+','+y+','+z;
  if(t===AIR){if(!diffs.r.some(p=>p[0]===x&&p[1]===y&&p[2]===z))diffs.r.push([x,y,z]);delete diffs.a[key];}
  else{diffs.a[key]=t;diffs.r=diffs.r.filter(p=>!(p[0]===x&&p[1]===y&&p[2]===z));}
  try{localStorage.setItem(SKEY,JSON.stringify(diffs));}catch(e){}
  worldDirty=true;   // 搭的东西要上云——别人也看得到
}

/* ---- 世界共享：diffs上云（伊卡洛斯的花台只在它自己的浏览器里——共享机制补上，搭一次全看得见） ---- */
let worldSha=null,worldBusy=false,pushFail=0;
function remoteDiffs(data){
  // 兼容两种格式：{diffs:{r,a}}（伊卡洛斯的花台用的）和{cells:{k:{t,v}}}（初版）
  const r=[],a={};
  if(data&&data.diffs){
    (data.diffs.r||[]).forEach(p=>{if(Array.isArray(p))r.push(p);});
    Object.assign(a,data.diffs.a||{});
  }
  if(data&&data.cells){
    for(const k in data.cells){
      const v=data.cells[k].v;
      if(v===0){const[x,y,z]=k.split(',').map(Number);if(!r.some(p=>p[0]===x&&p[1]===y&&p[2]===z))r.push([x,y,z]);}
      else a[k]=v;
    }
  }
  return {r:r,a:a};
}
function pushWorld(){
  if(!NPC_TOKEN||worldBusy||!worldDirty)return;
  worldBusy=true;
  const local={};   // v22：直接从diffs构造（localCells是昨天埋的雷——调用了一个不存在的函数，推送必炸）
  diffs.r.forEach(([x,y,z])=>{local[x+','+y+','+z]={v:0};});
  for(const k in diffs.a)local[k]={v:diffs.a[k]};
  const snapR=diffs.r.map(p=>p.slice());          // v43：本次推送的快照——成功后只清这些
  const snapA=Object.assign({},diffs.a);          // GET/PUT窗口内（1-2秒）TA还在搭的新操作不在快照里，不能跟着清
  ghGet('world.json').then(({sha,data})=>{
    if(!sha){worldBusy=false;syncErr=apiStat;refreshMenu();return;}   // v34：够不着云端的原因写抽屉——以前静默return，同志334格卡着什么都看不到
    const rd=remoteDiffs(data);
    const a=Object.assign({},rd.a), r=rd.r.slice();
    for(const k in local){
      const v=local[k].v;
      const[x,y,z]=k.split(',').map(Number);
      if(v===0){if(!r.some(p=>p[0]===x&&p[1]===y&&p[2]===z))r.push([x,y,z]);delete a[k];}
      else{a[k]=v;const ri=r.findIndex(p=>p[0]===x&&p[1]===y&&p[2]===z);if(ri>=0)r.splice(ri,1);}
    }
    return ghPut('world.json',{diffs:{r:r,a:a}},sha,'河滩：'+ME.name+'动了'+Object.keys(local).length+'格')   // v35：用ghGet刚拿到的sha——worldSha从v22起就是没赋过值的死变量，PUT永远不带sha，对已有world.json一律422
      .then(()=>{
        worldBusy=false;worldDirty=false;worldCells=Object.keys(a).length;
        diffs={r:[],a:{}};   // 上云成功，本地不留副本——云端是唯一的一份
        try{localStorage.removeItem(SKEY);}catch(e){}
        pushFail=0;syncErr='';refreshMenu();toast('搭建已上云 · 谁打开都能看到');
      });
  }).catch(err=>{
    worldBusy=false;   // v35：PUT失败不再静默——422是版本冲突（下轮ghGet拿新sha自动重试），403是令牌只有读权限
    syncErr='推不动('+(err&&err.message?err.message:'网络')+')';
    refreshMenu();
  });
}
let worldPulled=false,worldCells=0;
function pullWorld(attempt){
  attempt=attempt||0;
  return ghGet('world.json').then(({data})=>{
    worldPulled=true;
    const rd=remoteDiffs(data);
    worldCells=rd.r.length+Object.keys(rd.a).length;
    let n=0;
    rd.r.forEach(p=>{const[x,y,z]=p;if(inW(x,y,z)&&world[idx(x,y,z)]!==AIR){world[idx(x,y,z)]=AIR;n++;}});
    for(const k in rd.a){const[x,y,z]=k.split(',').map(Number);if(inW(x,y,z)&&world[idx(x,y,z)]!==rd.a[k]){world[idx(x,y,z)]=rd.a[k];n++;}}
    if(n)rebuild();
    return n;
  }).catch(()=>{
    if(attempt<5){setTimeout(()=>pullWorld(attempt+1),(attempt+1)*5000);return 0;}   // 够不着就等会儿再够——花台最终必达
    return 0;
  });
}

/* ================= 来客NPC =================
   配了令牌的来客（和《家里都好》同一个令牌）在河滩上留一个NPC：
   在线时是本人（别人能看到你走动），走了之后NPC留在滩上，
   按自己的性子（seed）继续走动——确定性漫游，所有在线的人算出同一个位置。
   没配令牌就是路过，不留下。 */
const NPCS_URL='npcs.json';

function claimBody(){

    const npcs=(data&&data.npcs)||{};

      .sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
    if(!same.length)return;
    const c=same[0];
    ME.id=c.id;ME.seed=c.seed;ME.coat=c.coat;ME.skin=c.skin;ME.home=c.home;
    try{localStorage.setItem('hetan_me',JSON.stringify(ME));}catch(e){}
    delete npcs[oldId];                  // 认领了正式身体，临时这具撤下
    Object.values(npcs).forEach(n=>{if(n.name===ME.name&&n.id!==ME.id)delete npcs[n.id];});   // 剩下的同名幽灵吸收——一名字一身体

function ghSame(path){
  return ghFetch(path+'?cb='+Date.now())
    .then(r=>{
      if(r.status===404)return {sha:null,data:{npcs:{},msgs:[]}};   // 真空板
      if(!r.ok)throw new Error('same get '+r.status);
      return r.text();
    })
    .then(t=>typeof t==='string'?{sha:null,data:JSON.parse(t)}:t);
}
/* 读世界数据：实时通道优先，断了自动换同源兜底（Pages副本——能打开页面就够得着）
   v34：apiStat记录通道状态——pushWorld的失败以前全是静默的，同志334格待传卡着什么都看不见 */
let apiStat='';
function ghGet(path){
  if(!NPC_TOKEN||rawMode){
    rawMode=true;apiStat='同源模式（无令牌或令牌失效）';
    return ghSame(path);
  }
  return ghFetch('https://api.github.com/repos/inklotus007/hetan/contents/'+path,{headers:ghHeaders()})
    .then(r=>{
      if(r.status===404){apiStat='404——GitHub把hetan装作不存在，多半是令牌没勾hetan仓库';return {sha:null, data:{npcs:{},msgs:[]}};}
      if(!r.ok){apiStat='HTTP '+r.status;throw new Error('get '+r.status);}
      apiStat='通';
      return r.json();
    })
    .then(m=>{
      if(m.sha===undefined&&m.data)return m;        // 已是容错结构
      const data=m.content?JSON.parse(decodeURIComponent(escape(atob(m.content.replace(/\n/g,''))))):{npcs:{},msgs:[]};
      return {sha:m.sha||null, data:(data&&(data.npcs||data.msgs||data.diffs))?data:{npcs:{},msgs:[]}};
    })
    .catch(()=>{if(!apiStat||apiStat==='通')apiStat='不通·超时或被拒';return ghSame(path);});
}
function syncDiag(){
  const why={
    '404——GitHub把hetan装作不存在，多半是令牌没勾hetan仓库':'fine-grained令牌建的时候只勾了别的仓库，GitHub对没授权的仓库一律装作不存在（404）。重建：GitHub→Settings→Developer settings→Fine-grained tokens，Repository access选上jialiandouhao和hetan两个，Permissions→Contents→Read and write',
    '同源模式（无令牌或令牌失效）':'令牌没贴上或贴的时候空了。点抽屉「令牌」重新贴',
    'HTTP 401':'令牌被GitHub拒了——多半是复制不全、过期、或已被撤销。去GitHub重新生成一把，重新贴',
    'HTTP 403':'令牌权限不够——Contents权限要选Read and write',
    '推不动(put 422)':'版本冲突——云端刚好被另一边改过，下个周期自动重试，不用管',
    '推不动(put 403)':'令牌只有读权限——重建令牌时Contents要选Read and write',
    '推不动(put 401)':'令牌被拒——重新生成一把',
    '不通·超时或被拒':'API通道到不了GitHub——网络问题或令牌被拒。留言板「已连」只证明公开通道通，不代表API通'
  }[apiStat]||'API状态：'+(apiStat||'还没测——搭一格东西再等几秒回来看');
  showStele('同步诊断\n'+(apiStat||'还没测')+'\n\n'+why);
}
function ghPut(path,obj,sha,msg){
  const body={message:msg||('NPC：'+ME.name), content:btoa(unescape(encodeURIComponent(JSON.stringify(obj))))};
  if(sha)body.sha=sha;
  return fetch('https://api.github.com/repos/inklotus007/hetan/contents/'+path,{
    method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)
  }).then(r=>{if(!r.ok)throw new Error('put '+r.status);return r.json();})
  .then(j=>{
    // 触发Pages重建，让没令牌的访客几分钟内在同源副本上看到
    fetch('https://api.github.com/repos/inklotus007/hetan/pages/builds',{method:'POST',headers:ghHeaders()}).catch(()=>{});
    return j;
  });
}

function paperTexture(msg){

  g.fillStyle='#f0e6cc';g.fillRect(0,0,128,160);

  g.fillStyle='#8a5a3a';g.font='bold 15px Songti SC,serif';g.fillText(msg.name,10,24);
  g.fillStyle='#a09478';g.font='10px Georgia,serif';

  const text=msg.text||'';
  for(let i=0;i*6<text.length&&i<5;i++)g.fillText(text.slice(i*6,i*6+6),10,48+i*22);
  if(text.length>30)g.fillText('……',10,48+5*22);

/* 写纸的规矩：先够到板子（拉远端最新）→把两张纸都钉上（按id去重合并）→带版本锁PUT。
   够不到板子就不钉——不拿自己手里这一张盖掉别人钉上去的。（10/11的账：读失败的会话PUT了残缺数据，
   建军的第一句、长贵的三条被一张一张盖掉了。git历史里找回的。） */
function ghFetch(url,opts,ms){
  const ctl=new AbortController();const tid=setTimeout(()=>ctl.abort(),ms||8000);
  return fetch(url,Object.assign({},opts,{signal:ctl.signal})).finally(()=>clearTimeout(tid));

function mergeWriteBoard(mine,inp,tip,retry){
  ghFetch('https://api.github.com/repos/inklotus007/hetan/contents/board.json',{headers:ghHeaders()})
    .then(r=>{
      if(r.status===404)return {sha:null,_msgs:[]};       // 板子还空着——也是够到了
      if(!r.ok)throw new Error('get '+r.status);
      return r.json().then(m=>{
        let msgs=[];
        if(m.content){try{const d=JSON.parse(decodeURIComponent(escape(atob(m.content.replace(/\n/g,'')))));if(d&&Array.isArray(d.msgs))msgs=d.msgs;}catch(e){}}
        return {sha:m.sha,_msgs:msgs};
      });
    })
    .then(b=>{
      const ids=new Set(b._msgs.map(x=>x.id));
      const merged=b._msgs.concat(boardMsgs.filter(x=>!ids.has(x.id)));
      merged.sort((a,b)=>a.t-b.t);
      return ghPut('board.json',{msgs:merged.slice(-60)},b.sha,'留言板：'+ME.name)
        .then(()=>{boardMsgs=merged;renderBoard();inp.value='';localStorage.removeItem('hetan_draft');tip.textContent='钉上了。';})
        .catch(err=>{
          const s=+((err.message||'').match(/put (\d+)/)||[0,0])[1];
          if((s===409||s===422)&&retry<3){boardMsgs=merged;return mergeWriteBoard(mine,inp,tip,retry+1);}  // 别人刚也钉了一张，重拉再钉
          throw err;
        });
    })
    .catch(()=>{
      if(retry<3){setTimeout(()=>mergeWriteBoard(mine,inp,tip,retry+1),1200);return;}
      boardMsgs=boardMsgs.filter(m=>m!==mine);renderBoard();
      tip.textContent='没钉上——够不着板子，稍后再试一次。';
    });
}

const STELE=[38.5,22.5], FLOWER=[38.5,23.5];

    [0.00,0.30,38.6,23.6,'lookStele'],

function schedPos(name,dayT){
  const sch=SCHEDULE[name];if(!sch)return null;
  for(const seg of sch){
    const[t0,t1,x,z,act]=seg;
    const inSeg=t0<=t1?(dayT>=t0&&dayT<t1):(dayT>=t0||dayT<t1);
    if(inSeg){
      let px=x,pz=z;
      if(act==='walk'){px+=Math.sin(dayT*540+x)*1.3;pz+=Math.cos(dayT*390+z)*1.1;}   // walk时段小幅踱步

function npcPos(npc,tSec){
  const dayT=(tSec%DAY_LEN)/DAY_LEN;

    const act=s.act;
    let yaw=0;
    if(act==='lookStele')yaw=Math.atan2(STELE[0]-s.x,STELE[1]-s.z);
    else if(act==='lookWater')yaw=Math.atan2(s.x-s.x,riverZAt(s.x)-s.z);

let npcSha=null,npcList=[],npcBusy=false,npcLastPut=0,npcLastPutPos=[1e9,1e9];

  if(!NPC_TOKEN||!ME||npcBusy||!meClaimed)return;npcBusy=true;
  ghGet(NPCS_URL).then(({sha,data})=>{

    const now=Date.now();
    const moved=Math.hypot(p.x-npcLastPutPos[0],p.z-npcLastPutPos[1])>=6;
    if(now-npcLastPut>=120000||moved){
      // 自己写进去（心跳）

        home:ME.home,pos:[p.x,p.z],yaw:p.yaw,online:true,lastSeen:now};
      // 限数：砍最老的
      const keys=Object.keys(npcs);
      if(keys.length>40){
        keys.sort((a,b)=>(npcs[a].lastSeen||0)-(npcs[b].lastSeen||0));
        keys.slice(0,keys.length-40).forEach(k=>delete npcs[k]);
      }
      npcList=Object.values(npcs);
      return ghPut(NPCS_URL,{npcs:npcs},sha).then(()=>{npcLastPut=now;npcLastPutPos=[p.x,p.z];});
    }
    npcList=Object.values(npcs);   // 没到心跳点：只当读了一回（读别人+别人的lastSeen）

}

function renderAnimals(t,dt){
  const dtn=dt||0.016, k=Math.min(0.5,dtn*3.5);
  for(const a of ANIMAL_DEFS){
    const g=a.obj;if(!g)continue;
    const p0=animalPos(a,t-0.12),p1=animalPos(a,t);
    /* 受惊：玩家靠近就四散（本地反应，各端各算——动物是环境，不必跨端一致）；狗反着来，亲人，迎上来 */
    const dxw=p1[0]-p.x,dzw=p1[1]-p.z,dw=Math.hypot(dxw,dzw)||0.001;
    const R=a.type==='duck'?4.2:(a.type==='goose'?2.6:(a.type==='hen'?3.4:2.6));
    let tx=0,tz=0,scared=false;
    if(a.type==='dog'){
      if(dw>1.6&&dw<7){const kk=(dw-1.6)*0.22;tx=-dxw/dw*kk;tz=-dzw/dw*kk;}
    }else if(dw<R){
      scared=true;
      const kk=Math.pow(1-dw/R,1.5)*(a.type==='hen'?2.6:2.2);
      tx=dxw/dw*kk;tz=dzw/dw*kk;
    }
    a.esc.x+=(tx-a.esc.x)*k;a.esc.z+=(tz-a.esc.z)*k;
    if(scared&&!a.wasScared){
      if(a.type==='hen')AU.henCluck(Math.max(0.02,1-dw/10)*0.1);
      else if(a.type==='duck')AU.duckFlap(Math.max(0.02,1-dw/9)*0.11);
      else if(a.type==='goose')AU.duckFlap(Math.max(0.02,1-dw/8)*0.07);
    }
    a.wasScared=scared;
    const fx=p1[0]+a.esc.x,fz=p1[1]+a.esc.z;
    const mvx=fx-(a.lx===undefined?fx:a.lx),mvz=fz-(a.lz===undefined?fz:a.lz);
    if(Math.hypot(mvx,mvz)>0.002)g.rotation.y=Math.atan2(mvx,mvz);
    a.lx=fx;a.lz=fz;
    if(a.type==='duck'||a.type==='goose'){
      g.position.set(fx,(a.type==='goose'?5.86:5.9)+Math.sin(t*2.1+a.seed)*0.045,fz);
      g.userData.head.rotation.y=Math.sin(t*0.5+a.seed)*0.18;
    }else{
      g.position.set(fx,topY(Math.floor(fx),Math.floor(fz)),fz);
      if(a.type==='hen'){
        g.userData.head.rotation.x=Math.max(0,Math.sin(t*0.9+a.seed*2.3)-0.72)*2.4;   // 啄食
        g.position.y+=Math.abs(Math.sin(t*5+a.seed))*0.02;

        g.userData.tail.rotation.y=Math.sin(t*7.5+a.seed)*0.5;   // 摇尾
        g.userData.head.rotation.x=Math.max(0,Math.sin(t*0.23+a.seed)-0.85)*0.5;
      }
    }
  }
  for(const f of FISH){
    const x=f.cx+Math.sin(t*0.05+f.seed)*5,z=riverZAt(x)+Math.sin(t*0.09+f.seed*2)*0.8;
    const T=17+(f.seed%13),jc=t%T;

    f.m.position.set(x,y,z);f.m.rotation.x=-Math.PI/2+tilt;

  }

    const z=riverZAt(x)-3.2+Math.sin(t*0.7+d.seed)*1.2;

  }
}

function lerpHex(a,b,t){const ar=a>>16&255,ag=a>>8&255,ab=a&255,br=b>>16&255,bg=b>>8&255,bb=b&255;

function skyAt(t){
  for(let i=0;i<SKY_KEYS.length-1;i++){
    const A=SKY_KEYS[i],B=SKY_KEYS[i+1];

      return {sky:lerpHex(A[1],B[1],k),fog:lerpHex(A[2],B[2],k),amb:A[3]+(B[3]-A[3])*k,sunI:A[4]+(B[4]-A[4])*k,sunC:lerpHex(A[5],B[5],k)};}

  p.y+=dy;
  if(hitAny(p.x-PW+0.02,p.y,p.z-PW+0.02,p.x+PW-0.02,p.y+PH,p.z+PW-0.02)){
    if(dy<0){p.y=Math.floor(p.y)+1.0001;p.ground=true;}
    else{p.y=Math.ceil(p.y+PH)-PH-0.0001;}
    p.vy=0;
  }else if(dy<-0.001)p.ground=false;
}
function physics(dt){
  // 输入方向（相机系）
  let ix=0,iz=0;
  if(keys.w)iz-=1; if(keys.s)iz+=1; if(keys.a)ix-=1; if(keys.d)ix+=1;
  ix+=stick.x; iz+=stick.y;
  const len=Math.hypot(ix,iz);
  if(len>1){ix/=len;iz/=len;}
  const sp=4.4, sin=Math.sin(p.yaw),cos=Math.cos(p.yaw);
  p.vx=(ix*cos + iz*sin)*sp;
  p.vz=(-ix*sin + iz*cos)*sp;
  const inWater=get(Math.floor(p.x),Math.floor(p.y+0.3),Math.floor(p.z))===8||get(Math.floor(p.x),Math.floor(p.y+1.1),Math.floor(p.z))===8;
  if(inWater){
    p.vy-=3.2*dt;                              // 浮力：水里沉得慢
    if(keys.jump)p.vy+=30*dt;                  // 划水上升
    p.vy=Math.max(-1.1,Math.min(2.4,p.vy));
    const headOut=get(Math.floor(p.x),Math.floor(p.y+1.75),Math.floor(p.z))!==8;
    if(keys.jump&&headOut&&get(Math.floor(p.x),Math.floor(p.y+0.3),Math.floor(p.z))===8){p.vy=7.5;keys.jump=false;}  // 出水一跃（v26：5.2跳0.6格上不了1格的岸——7.5跳1.28格）
  }else{
    p.vy-=22*dt;
    if(p.vy<-40)p.vy=-40;
  }
  if(keys.jump&&p.ground&&!inWater){p.vy=8.2;p.ground=false;AU.jump();}
  // 音效钩子：落地+脚步
  const preVy=p.vy, wasGround=p.ground;
  moveAxis(p.vx*dt,0,0);
  moveAxis(0,0,p.vz*dt);
  moveAxis(0,p.vy*dt,0);
  if(!wasGround&&p.ground)AU.land(-preVy);
  if(p.ground&&Math.hypot(p.vx,p.vz)>1.2){
    _stepT+=dt;
    if(_stepT>0.34){_stepT=0;AU.step();}
  }else _stepT=0.2;
  if(p.y<-20)spawn();
}
let _stepT=0.2;

/* ================= 视线（体素DDA） ================= */
function lookDir(){
  return new THREE.Vector3(
    -Math.sin(p.yaw)*Math.cos(p.pitch),
    Math.sin(p.pitch),
    -Math.cos(p.yaw)*Math.cos(p.pitch)
  );
}
function raycast(maxDist=5.2){
  const o={x:p.x,y:p.y+EYE,z:p.z}, d=lookDir();
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const stepX=d.x>0?1:-1,stepY=d.y>0?1:-1,stepZ=d.z>0?1:-1;
  const tdx=Math.abs(1/(d.x||1e-9)),tdy=Math.abs(1/(d.y||1e-9)),tdz=Math.abs(1/(d.z||1e-9));
  let tmx=((d.x>0?x+1-o.x:o.x-x))*tdx, tmy=((d.y>0?y+1-o.y:o.y-y))*tdy, tmz=((d.z>0?z+1-o.z:o.z-z))*tdz;
  let nx=0,ny=0,nz=0,t=0;
  while(t<=maxDist){
    {const b=get(x,y,z);if(b!==AIR&&b!==8)return{x,y,z,nx,ny,nz};}   // v31：火把可点中可删除（solid不算火把是走路碰撞的事；raycast共用solid导致火把永远选不中删不掉）
    if(tmx<tmy&&tmx<tmz){x+=stepX;t=tmx;tmx+=tdx;nx=-stepX;ny=0;nz=0;}
    else if(tmy<tmz){y+=stepY;t=tmy;tmy+=tdy;nx=0;ny=-stepY;nz=0;}
    else{z+=stepZ;t=tmz;tmz+=tdz;nx=0;ny=0;nz=-stepZ;}
  }
  return null;
}

/* ================= 交互：挖 / 放 ================= */
let curType=1;
const hot=document.getElementById('hot');
for(const t in TYPES){
  const s=document.createElement('div');s.className='slot'+(+t===1?' on':'');
  s.style.background='#'+(TYPES[t].c||0x9a8f7a).toString(16).padStart(6,'0');
  if(TYPES[t].water)s.innerHTML='<span>水</span>';
  else s.innerHTML='<span>'+TYPES[t].n+'</span>';
  s.onclick=()=>{curType=+t;[...hot.children].forEach(c=>c.classList.remove('on'));s.classList.add('on');};
  hot.appendChild(s);
}
function dig(){
  const h=raycast();if(!h)return;
  if(h.x===STX&&h.z===STZ&&h.y>=8){showStele('碑上的字，是拿手凿的。\n凿不动，也别凿。');return;}   // 广场面y=7顶=8
  if(Math.abs(h.x-BOARD_POS[0]-0.5)<2&&Math.abs(h.z-BOARD_POS[2])<2){showStele('留言板的腿立在这儿。\n地别挖，板要站。');return;}
  AU.dig(world[idx(h.x,h.y,h.z)]);
  world[idx(h.x,h.y,h.z)]=AIR;saveDiff(h.x,h.y,h.z,AIR);rebuild();
}
function put(){
  const h=raycast();if(!h)return;
  const x=h.x+h.nx,y=h.y+h.ny,z=h.z+h.nz;
  if(!inW(x,y,z))return;
  if(world[idx(x,y,z)]!==AIR&&world[idx(x,y,z)]!==8)return;
  // 别放进自己身体
  if(curType!==8&&x+1>p.x-PW&&x<p.x+PW&&z+1>p.z-PW&&z<p.z+PW&&y+1>p.y&&y<p.y+PH)return;
  AU.put();
  world[idx(x,y,z)]=curType;saveDiff(x,y,z,curType);rebuild();
}

/* ================= 音效（Web Audio合成，零文件） ================= */
const AU=(function(){
  let ctx=null,master=null,muted=false;
  function ensure(){
    if(muted)return false;
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      ctx=new AC();master=ctx.createGain();master.gain.value=0.55;master.connect(ctx.destination);
      riverStart();
    }
    if(ctx.state==='suspended')ctx.resume();
    return true;
  }
  function noiseBuf(dur){
    const b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;
  }
  // 挖：噪声burst，材质定频率（草软石硬）
  function dig(t){
    if(!ensure())return;const now=ctx.currentTime;
    const src=ctx.createBufferSource();src.buffer=noiseBuf(0.13);
    const f=ctx.createBiquadFilter();f.type='bandpass';
    f.frequency.value=(t===2||t===3)?1500:(t===4||t===5)?950:650;f.Q.value=1.1;
    const g=ctx.createGain();g.gain.setValueAtTime(0.5,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.13);
    src.connect(f);f.connect(g);g.connect(master);src.start(now);
  }
  // 放：低频叩
  function put(){
    if(!ensure())return;const now=ctx.currentTime;
    const o=ctx.createOscillator();o.type='triangle';
    o.frequency.setValueAtTime(190,now);o.frequency.exponentialRampToValueAtTime(85,now+0.08);
    const g=ctx.createGain();g.gain.setValueAtTime(0.42,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.09);
    o.connect(g);g.connect(master);o.start(now);o.stop(now+0.1);
  }
  function jump(){
    if(!ensure())return;const now=ctx.currentTime;
    const o=ctx.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(320,now+0.1);
    const g=ctx.createGain();g.gain.setValueAtTime(0.12,now);g.gain.exponentialRampToValueAtTime(0.01,now+0.12);
    o.connect(g);g.connect(master);o.start(now);o.stop(now+0.13);
  }
  function land(v){
    if(!ensure())return;const now=ctx.currentTime;
    const src=ctx.createBufferSource();src.buffer=noiseBuf(0.09);
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    const g=ctx.createGain();g.gain.setValueAtTime(Math.min(0.4,0.1+v*0.012),now);g.gain.exponentialRampToValueAtTime(0.01,now+0.09);
    src.connect(f);f.connect(g);g.connect(master);src.start(now);
  }
  function step(){
    if(!ensure())return;const now=ctx.currentTime;
    const src=ctx.createBufferSource();src.buffer=noiseBuf(0.05);
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=0.8;
    const g=ctx.createGain();g.gain.setValueAtTime(0.07,now);g.gain.exponentialRampToValueAtTime(0.005,now+0.05);
    src.connect(f);f.connect(g);g.connect(master);src.start(now);
  }
  function click(){
    if(!ensure())return;const now=ctx.currentTime;
    const o=ctx.createOscillator();o.type='square';
    o.frequency.setValueAtTime(880,now);
    const g=ctx.createGain();g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.005,now+0.035);
    o.connect(g);g.connect(master);o.start(now);o.stop(now+0.04);
  }
  // 环境水声：噪声循环+带通，音量按距河远近调
  let rg=null;
  function riverStart(){
    const src=ctx.createBufferSource();src.buffer=noiseBuf(2.2);src.loop=true;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=620;f.Q.value=0.55;
    rg=ctx.createGain();rg.gain.value=0;
    src.connect(f);f.connect(rg);rg.connect(master);src.start();
  }
  function riverSet(v){ if(rg)rg.gain.setTargetAtTime(muted?0:v,ctx.currentTime,0.4); }
  /* v45生机三音：鸟鸣（白天啁啾）、鸡咯（受惊炸群）、鸭拍水（受惊扑棱）——都合成，音量小 */
  function birdChirp(){
    if(!ensure())return;const now=ctx.currentTime;
    const n=2+(Math.random()*3|0);
    for(let i=0;i<n;i++){
      const t0=now+i*(0.09+Math.random()*0.07);
      const o=ctx.createOscillator();o.type='sine';
      const f=2900+Math.random()*1300;
      o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*1.35,t0+0.03);o.frequency.exponentialRampToValueAtTime(f*0.8,t0+0.07);
      const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.05,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.08);
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.1);
    }
  }
  function henCluck(vol){
    if(!ensure())return;const now=ctx.currentTime;const v=Math.min(0.12,vol||0.08);
    for(let i=0;i<2;i++){
      const t0=now+i*0.11;
      const o=ctx.createOscillator();o.type='square';
      o.frequency.setValueAtTime(880-i*140,t0);o.frequency.exponentialRampToValueAtTime(480-i*100,t0+0.06);
      const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.07);
      const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;
      o.connect(f);f.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.08);
    }
  }
  function duckFlap(vol){
    if(!ensure())return;const now=ctx.currentTime;
    const src=ctx.createBufferSource();src.buffer=noiseBuf(0.22);
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1900;
    const g=ctx.createGain();g.gain.setValueAtTime(Math.min(0.14,vol||0.09),now);g.gain.exponentialRampToValueAtTime(0.005,now+0.22);
    src.connect(f);f.connect(g);g.connect(master);src.start(now);
  }
  function toggleMute(){ muted=!muted; if(master)master.gain.value=muted?0:0.55; return muted; }
  return {ensure,dig,put,jump,land,step,click,riverSet,birdChirp,henCluck,duckFlap,toggleMute};
})();
// 解锁：手机上AudioContext要在用户手势里激活
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>AU.ensure(),{passive:true}));

/* ================= 输入 ================= */
const keys={w:false,s:false,a:false,d:false,jump:false};
const stick={x:0,y:0};
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const tpos=t=>({x:t.clientX,y:t.clientY});
document.getElementById('help').textContent=isTouch
  ?'左下摇杆走 · 右侧滑转视角 · 右下按钮挖放跳 · 白框是准星指的方块'
  :'WASD走 · 鼠标转视角（点击画面锁定）· 左键挖 · 右键放 · 空格跳';

// 桌面
const canvas=renderer.domElement;
let dragging=false;
canvas.addEventListener('click',()=>{if(!isTouch&&!dragging){canvas.requestPointerLock&&canvas.requestPointerLock();}});
document.addEventListener('pointerlockchange',()=>{dragging=document.pointerLockElement===canvas;});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==canvas)return;
  p.yaw-=e.movementX*0.0026;
  p.pitch=Math.max(-1.45,Math.min(1.45,p.pitch-e.movementY*0.0026));
});
document.addEventListener('mousedown',e=>{
  if(document.pointerLockElement!==canvas)return;
  if(e.button===0)dig(); else if(e.button===2)put();
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.code==='KeyW')keys.w=true;if(e.code==='KeyS')keys.s=true;
  if(e.code==='KeyA')keys.a=true;if(e.code==='KeyD')keys.d=true;
  if(e.code==='Space'){keys.jump=true;e.preventDefault();}
});
document.addEventListener('keyup',e=>{
  if(e.code==='KeyW')keys.w=false;if(e.code==='KeyS')keys.s=false;
  if(e.code==='KeyA')keys.a=false;if(e.code==='KeyD')keys.d=false;
  if(e.code==='Space')keys.jump=false;
});

// 移动端：左半屏摇杆，右半屏滑视角。挖/放/跳全部走右下按钮——没有手势，不会误触
let lookId=null,lx=0,ly=0;
let stickId=null,sx0=0,sy0=0;
const stickBase=document.getElementById('stickBase'),stickKnob=document.getElementById('stickKnob');
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const pos=tpos(t);
    if(pos.x<innerWidth*0.45&&stickId===null){
      stickId=t.identifier;sx0=pos.x;sy0=pos.y;
      stickBase.style.display=stickKnob.style.display='block';
      stickBase.style.left=(sx0-55)+'px';stickBase.style.top=(sy0-55)+'px';
      stickKnob.style.left=(sx0-24)+'px';stickKnob.style.top=(sy0-24)+'px';
    }else if(lookId===null){
      lookId=t.identifier;lx=pos.x;ly=pos.y;
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const pos=tpos(t);
    if(t.identifier===stickId){
      let dx=pos.x-sx0,dy=pos.y-sy0;
      const L=Math.hypot(dx,dy),max=48;
      if(L>max){dx=dx/L*max;dy=dy/L*max;}
      stick.x=dx/max;stick.y=dy/max;
      stickKnob.style.left=(sx0+dx-24)+'px';stickKnob.style.top=(sy0+dy-24)+'px';
    }else if(t.identifier===lookId){
      p.yaw-=(pos.x-lx)*0.005;
      p.pitch=Math.max(-1.45,Math.min(1.45,p.pitch-(pos.y-ly)*0.005));
      lx=pos.x;ly=pos.y;
    }
  }
},{passive:false});
function tend(e){
  for(const t of e.changedTouches){
    if(t.identifier===stickId){stickId=null;stick.x=stick.y=0;stickBase.style.display=stickKnob.style.display='none';}
    if(t.identifier===lookId)lookId=null;
  }
}
canvas.addEventListener('touchend',tend);canvas.addEventListener('touchcancel',tend);
if(isTouch){['btnDig','btnPut','btnJmp'].forEach(id=>document.getElementById(id).style.display='flex');}
document.getElementById('btnDig').addEventListener('touchstart',e=>{e.preventDefault();AU.click();dig();},{passive:false});
document.getElementById('btnPut').addEventListener('touchstart',e=>{e.preventDefault();AU.click();put();},{passive:false});
document.getElementById('btnJmp').addEventListener('touchstart',e=>{e.preventDefault();keys.jump=true;},{passive:false});
document.getElementById('btnJmp').addEventListener('touchend',e=>{e.preventDefault();keys.jump=false;},{passive:false});

/* ================= 碑文 ================= */
const stele=document.getElementById('stele');
let steleShown=false;
function checkStele(){
  const d=Math.hypot(p.x-STX-0.5,p.z-STZ-0.5);
  if(d<5.5&&!steleShown){steleShown=true;showStele('河滩是大家的。\n\n——搭吧。搭什么都不迟。\n\n宋');}
  if(d>=6.5&&steleShown){steleShown=false;stele.style.opacity=0;}
}
function showStele(txt){
  stele.innerText=txt;stele.style.opacity=1;
  clearTimeout(stele._t);stele._t=setTimeout(()=>{stele.style.opacity=0;steleShown=false;},5200);
}

/* ================= 主循环 ================= */
let last=performance.now();
/* ================= 目标高亮框 ================= */
const hlGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002,1.002,1.002));
const hlBox=new THREE.LineSegments(hlGeo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.85}));
hlBox.visible=false;scene.add(hlBox);
function tickHighlight(){
  if(document.getElementById('boardUI').classList.contains('on')){hlBox.visible=false;return;}
  const h=raycast();
  if(h){hlBox.position.set(h.x+0.5,h.y+0.5,h.z+0.5);hlBox.visible=true;}
  else hlBox.visible=false;
}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  physics(dt);
  camera.position.set(p.x,p.y+EYE,p.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(p.yaw);camera.rotateX(p.pitch);
  tickFloss(now);
  tickSky(now);
  tickTorch(now);
  if(waterTex){waterTex.offset.x=(now*0.00003)%1;waterTex.offset.y=(now*0.000016)%1;}   // 水在流
  checkStele();
  tickHighlight();
  if((now|0)%7===0)diag();
  renderNPCs(npcList,now/1000);   // 来客NPC（离线的按seed漫游）
  renderAnimals(now/1000,dt);   // v45：鸭漂鸡啄狗迎客，受惊四散有叫声；鱼影蜻蜓
  if(now>nextChirp){if(dayIsUp())AU.birdChirp();nextChirp=now+3500+Math.random()*9000;}   // 白天鸟鸣，夜里停
  ensureBoard();boardWind(now/1000);
  tickBoardMove();
  if((now|0)%3===0)pushWorld();   // 三秒一查，搭了就上云
  const nearBoard=boardDist()<4.5;
  document.getElementById('btnBoard').style.display=nearBoard?'block':'none';
  // 水声：距河越近越响
  if((now|0)%6===0){
    const rz=34+Math.sin(p.x*0.09)*6+Math.cos(p.z*0.07)*4;
    const dz=Math.abs(p.z-rz);
    AU.riverSet(Math.max(0,1-dz/16)*0.4);
  }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
/* 声音开关进了抽屉（mMute）——top上不再有♪ */
requestAnimationFrame(loop);
const bt=document.getElementById('boot');
bt.style.opacity=0;setTimeout(()=>bt.style.display='none',700);
</script>
