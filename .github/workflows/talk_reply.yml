name: talk-reply
on:
  push:
    paths:
      - 'talk_queue.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: village-mind      # 10/26晚两run并发撞车（rebase冲突挂死→同志收失败邮件）——串行排队
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 村里人答话（带上各户记忆和今天的心事）
        run: python3 scripts/talk_reply.py
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
      - name: 养村民今天的心思（每天第一次触发时生成：心事+村里的话）
        run: python3 scripts/villager_minds.py || true
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
      - name: 顺路补村志（schedule不靠谱，答话是第二次机会）
        run: python3 scripts/chronicle_gen.py || true
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
      - name: 推送（rebase重试，防push race——10/25三次生成全被吞的教训）
        run: |
          git config user.name "村里人"
          git config user.email "villager@users.noreply.github.com"
          git add replies.json talk_queue.json chronicle.json 2>/dev/null || true
          git add villagers_memory.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有要推的，正常结束"
            exit 0
          fi
          git commit -m "村里人的心思：答话+心事+村志"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "推送成功（第${i}次）"
              exit 0
            fi
            echo "push第${i}次失败，第${i}次恢复"
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            sleep 6
          done
          # 真冲突（同文件双改）：舍本run结果，回到远端最新——另一run的成果在，queue里没答的话也在，下个触发重答
          git fetch origin main
          git reset --hard origin/main
          echo "并发冲突：本run结果弃了（数据无损，下个触发重跑）"
          exit 0
