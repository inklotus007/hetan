name: talk-reply
on:
  push:
    paths:
      - 'talk_queue.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/talk_reply.py
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_KEY }}
      - run: |
          git config user.name "村里人"
          git config user.email "villager@users.noreply.github.com"
          git add replies.json talk_queue.json
          git diff --cached --quiet || git commit -m "村里人答话"
          git push
